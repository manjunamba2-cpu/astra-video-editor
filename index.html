<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astra Video Editor Pro: AI Cuts</title>
    <!-- PWA Settings -->
    <meta name="theme-color" content="#38bdf8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .tagline {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 25px;
        }
        
        .intake-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 15px !important;
            margin-bottom: 20px !important;
            width: 100% !important;
            clear: both;
        }
        
        .preview-box {
            background: #0f172a !important;
            border: 2px dashed #1e293b;
            padding: 20px 10px !important;
            min-height: 90px !important;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: bold;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            box-sizing: border-box !important;
        }
        .preview-box:hover {
            transform: translateY(-2px);
            background: #1e293b !important;
        }
        .box-video { border-color: #0284c7 !important; color: #38bdf8 !important; }
        .box-music { border-color: #16a34a !important; color: #4ade80 !important; }
        .box-camera { background: #7f1d1d !important; border-color: #f87171 !important; color: #fca5a5 !important; }
        
        .studio-panel {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #1e293b;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .monitors-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .monitor-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            position: relative;
        }
        .video-preview-window {
            width: 100%;
            height: 180px;
            background: #000;
            object-fit: contain;
            border-radius: 4px;
        }
        .monitor-label {
            font-size: 11px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            width: 100%;
            text-align: left;
        }
        .live-subtitle-box {
            position: absolute;
            bottom: 55px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #fffde7;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            border-left: 3px solid #eab308;
            pointer-events: none;
            display: none;
        }
        .player-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
            width: 100%;
            border-top: 1px solid #1e293b;
            padding-top: 12px;
            margin-bottom: 20px;
        }
        .ctrl-btn {
            background: #1f2937;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .ctrl-btn:hover {
            background: #38bdf8;
            color: #0b0f19;
        }
        .time-display {
            font-family: monospace;
            font-size: 12px;
            color: #9ca3af;
            align-self: center;
            margin-left: auto;
        }
        .section-title {
            font-size: 14px;
            color: #38bdf8;
            margin: 20px 0 10px 0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .action-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-action {
            background: #1f2937;
            color: white;
            border: 1px solid #1e293b;
            padding: 12px 5px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-action:hover {
            background: #2d3748;
        }
        .btn-ai-magic {
            background: #1e1b4b;
            border: 1px solid #a21caf;
            color: #f472b6;
        }
        .btn-ai-magic:hover {
            background: #311042;
        }
        .btn-export {
            background: #0284c7;
            border: 1px solid #38bdf8;
        }
        .btn-export:hover {
            background: #0369a1;
        }
        
        .timeline-container {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }
        .timeline-scrubber-bar {
            width: 100%;
            margin-bottom: 15px;
            accent-color: #38bdf8;
        }
        .track-row {
            display: flex;
            height: 36px;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            font-size: 11px;
            margin-bottom: 6px;
            background: rgba(17, 24, 39, 0.6);
            border-radius: 4px;
            overflow: hidden;
        }
        .track-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .track-label {
            width: 80px;
            min-width: 80px;
            background: #1e293b;
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-weight: bold;
            color: #9ca3af;
            border-right: 1px solid #1e293b;
            box-sizing: border-box;
        }
        .track-block-fill {
            flex-grow: 1;
            height: 80%;
            margin: 0 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-weight: 500;
            font-size: 11px;
            white-space: nowrap;
            transition: width 0.3s ease;
        }
        .video-fill { background: rgba(2, 132, 199, 0.3); border: 1px solid #0284c7; color: #bae6fd; }
        .movie-fill { background: rgba(185, 28, 28, 0.3); border: 1px dashed #ef4444; color: #fca5a5; }
        .ai-fill { background: rgba(162, 28, 175, 0.4); border: 1px dashed #f472b6; color: #fbcfe8; }
        .audio-fill { background: rgba(22, 163, 74, 0.3); border: 1px solid #16a34a; color: #bbf7d0; }
        .text-fill { background: rgba(217, 70, 239, 0.3); border: 1px solid #d946ef; color: #fdf4ff; }
        
        .social-network-dock {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        .social-textarea {
            background: #111827;
            border: 1px solid #1e293b;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            resize: none;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .social-buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .btn-social-publish {
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            border: none;
            text-align: center;
        }
        .social-status-log {
            font-size: 11px;
            font-family: monospace;
            color: #34d399;
            margin-top: 10px;
            display: none;
            background: #111827;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #1e293b;
        }
        
        .hidden-uploader-node {
            display: none !important;
            visibility: hidden !important;
            position: absolute !important;
            z-index: -9999 !important;
            width: 1px !important;
            height: 1px !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Astra Video Editor Pro</h1>
