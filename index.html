<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Maker - Live Stream Workspace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        video {
            width: 100%;
            max-width: 640px;
            height: auto;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 4px;
            display: none; /* Controlled dynamically by camera.js */
        }
        .overlay {
            padding: 15px;
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px dashed #ff0000;
            margin-bottom: 10px;
            text-align: center;
        }
        .console-box {
            background-color: #000000;
            font-family: monospace;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            border: 1px solid #444;
            margin-top: 15px;
            color: #00ff00;
        }
        .btn-group {
            margin: 15px 0;
        }
        button, input[type="file"] {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
        }
        .progress-bar {
            background-color: #444;
            width: 0%;
            height: 5px;
            margin-top: 5px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Movie Maker Studio</h1>

    <!-- Structural Text Overlays & Notifications -->
    <div id="cameraTextOverlay" class="overlay">
        Camera offline. Please grant permissions and access the live camera pipeline loop.
    </div>

    <!-- Live Recording Lens UI Component Targets -->
    <video id="mainProgramView" autoplay muted></video>
    <video id="cameraPreviewStream" autoplay playsinline></video>

    <!-- UI Button Interfacing Triggers -->
    <div class="btn-group">
        <button onclick="startCameraPipeline()">Start Video Pipeline</button>
        <button onclick="stopActiveCamera()">Stop Active Session</button>
    </div>

    <!-- Audio Track Uploader Component Interface Layout -->
    <div class="uploader-section">
        <h3>Audio Background Mix</h3>
        <input type="file" id="audioUploader" accept="audio/*">
        <p id="musicStatusText">No audio track loaded</p>
        <div id="trackA1" class="progress-bar"></div>
    </div>

    <!-- Live Activity Debugging Terminal Monitor Logs -->
    <h3>System Activity Logs</h3>
    <div id="logConsole" class="console-box"></div>
</div>

<script>
    // ==========================================
    // DOM HARDWARE LAYER BINDINGS & COMPONENT INSTANCES
    // ==========================================
    const logConsole = document.getElementById("logConsole");
    const cameraTextOverlay = document.getElementById("cameraTextOverlay");
    const mainProgramView = document.getElementById("mainProgramView");
    const cameraPreviewStream = document.getElementById("cameraPreviewStream");
    const audioUploader = document.getElementById("audioUploader");
    const musicStatusText = document.getElementById("musicStatusText");
    const trackA1 = document.getElementById("trackA1");

    /**
     * Prints execution flows directly to the screen terminal layout
     */
    function printLog(message) {
        console.log(message);
        if (logConsole) {
            const timestamp = new Date().toLocaleTimeString();
            logConsole.innerHTML += `<br><span>[${timestamp}] ${message}</span>`;
            logConsole.scrollTop = logConsole.scrollHeight;
        }
    }

// * Controls global layout canvas states 
    function revealWorkspace(statusMsg = "WORKSPACE_READY") {
        printLog(`Reveal Workspace Triggered: ${statusMsg}`);
        // Global workspace animations or custom layout modifications go here
    }

    // ==========================================
    // --- Core Pipelines & Events ---
    // ==========================================

    // 1. Audio Track Uploader Event Logic
    if (audioUploader) {
        audioUploader.addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            const file = files[0];
            printLog("Processing structural mix for raw background feed...");

            // Update text configurations dynamically
            musicStatusText.innerText = "" + file.name;
            trackA1.style.width = "100%";

            printLog("Mixed background track asset: " + file.name);
        });
    }
</script>

<!-- Link Your Separate Modular Webcam Business Logic Script Here Safely -->
<script src="camera.js"></script>

</body>
</html>
